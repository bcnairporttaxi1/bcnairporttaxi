name: CI

# Vercel deploys every push to main automatically, so without this a broken
# commit reaches production before anyone knows. This runs the same checks
# required locally, and marks the commit red if they fail.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push makes an in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs postinstall, which is `prisma generate` — the generated
      # client is not committed, so nothing type-checks without it.
      - name: Install
        run: npm ci

      # Every step below runs the package script rather than the tool.
      #
      # These were `npx tsc --noEmit` and `npx eslint src`, written when this
      # was a single package with a tsconfig and a src/ at the root. The
      # monorepo migration moved both into apps/web and deleted the originals,
      # so tsc found no project and printed its help text, and eslint was
      # pointed at a directory that no longer existed. CI had been red on
      # every run since.
      #
      # Going through npm means the workflow reads the paths out of
      # package.json instead of restating them, so the next layout change
      # cannot desynchronise the two.
      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Deliberately `build:ci`, not `build`. The Vercel build command also runs
      # `prisma migrate deploy`, which needs a real database — correct on a
      # deployment, impossible here, and it was what failed the first run.
      # This step compiles the app and nothing else.
      - name: Build
        run: npm run build:ci
        env:
          # Never connected to; Prisma only needs a syntactically valid URL to
          # generate a client and type-check the queries.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          NEXT_PUBLIC_SITE_URL: https://bcnairporttaxi.es
